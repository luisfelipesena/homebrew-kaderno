name: Windows private platform proof
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft containing only the protected helper test sources
        required: true
        type: string
      source_sha256:
        description: Expected SHA256 of WindowsPrivatePlatform.tar.gz
        required: true
        type: string
permissions:
  contents: write
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_TAG: ${{ inputs.tag }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - name: Download verified draft source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:TEST_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft -or $release.isPrerelease) { throw 'Test source must remain a draft' }
          gh release download $env:TEST_TAG --repo $env:GITHUB_REPOSITORY --pattern WindowsPrivatePlatform.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $actual = (Get-FileHash WindowsPrivatePlatform.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SOURCE_SHA256) { throw 'Source digest mismatch' }
          tar -xzf WindowsPrivatePlatform.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
      - name: Run Windows synthetic checks
        shell: pwsh
        run: |
          pwsh -File scripts/windows-release/check-private.ps1 -Output "$PWD/evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows checks failed' }
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-private-platform-proof
          path: |
            evidence/protected-mesh.json
            evidence/artifact.json
            evidence/build.log
          if-no-files-found: error

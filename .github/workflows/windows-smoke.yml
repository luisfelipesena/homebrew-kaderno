name: Windows broker proof
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: write
jobs:
  broker:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_TAG: ${{ inputs.tag }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - name: Download private draft candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:TEST_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft -or $release.isPrerelease) { throw 'Draft required' }
          gh release download $env:TEST_TAG --repo $env:GITHUB_REPOSITORY --pattern WindowsBrokerProof.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-FileHash WindowsBrokerProof.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SOURCE_SHA256) { throw 'Digest mismatch' }
          tar -xzf WindowsBrokerProof.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
      - name: Run native helper and actual broker
        shell: pwsh
        run: |
          pwsh -File scripts/windows-release/check-private.ps1 -Output "$PWD/evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Native checks failed' }
          $manifest = Get-Content candidate/broker-source.json -Raw | ConvertFrom-Json
          foreach ($name in @('kaderno-local.exe', 'broker-proof.exe')) {
            if ((Get-FileHash "candidate/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.artifacts.$name) { throw 'Binary digest mismatch' }
            Copy-Item "candidate/$name" evidence/native/
          }
          Copy-Item candidate/broker-source.json evidence/
          & ./evidence/native/broker-proof.exe > evidence/broker-proof.json
          if ($LASTEXITCODE -ne 0) { throw 'Broker proof failed' }
      - name: Build and boot bundled WebView2 diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item evidence/native/* bundle/apps/windows/src-tauri/native/ -Recurse -Force
          Push-Location bundle/apps/windows
          cargo build --manifest-path src-tauri/Cargo.toml --locked *> "$env:GITHUB_WORKSPACE/evidence/tauri-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed' }
          Pop-Location
          $exe = "$PWD/bundle/apps/windows/src-tauri/target/debug/Kaderno.exe"
          # cargo build leaves resources beside the executable for a diagnostic run.
          Copy-Item evidence/native "$PWD/bundle/apps/windows/src-tauri/target/debug/native" -Recurse -Force
          $report = "$PWD/evidence/webview2-proof.json"
          $process = Start-Process $exe -ArgumentList @('--private-workspace','--private-proof', $report) -PassThru
          if (!$process.WaitForExit(90000)) { Stop-Process -Id $process.Id; throw 'WebView2 boot timed out' }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'WebView2 proof failed' }
          $proof = Get-Content $report -Raw | ConvertFrom-Json
          if (!$proof.ok) { throw 'WebView2 reported failure' }
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-broker-proof
          path: |
            evidence/*.json
            evidence/*.log
          if-no-files-found: error
